name: Publish NuGet Package

permissions:
  packages: write
  contents: write

on:
  push:
    branches:
      - master
  release:
    types: [published]

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: native-linux-x64
            native_path: LlmAgents.Tools/runtimes/linux-x64/native/libptyhelper.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            artifact_name: native-linux-arm64
            native_path: LlmAgents.Tools/runtimes/linux-arm64/native/libptyhelper.so
          - os: macos-latest
            rid: osx-arm64
            artifact_name: native-osx-arm64
            native_path: LlmAgents.Tools/runtimes/osx-arm64/native/libptyhelper.dylib
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Upload native artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.native_path }}
        if-no-files-found: error

  build-and-publish:
    needs: build-native
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Download linux-x64 native artifact
      uses: actions/download-artifact@v4
      with:
        name: native-linux-x64
        path: LlmAgents.Tools/runtimes/linux-x64/native

    - name: Download linux-arm64 native artifact
      uses: actions/download-artifact@v4
      with:
        name: native-linux-arm64
        path: LlmAgents.Tools/runtimes/linux-arm64/native

    - name: Download osx-arm64 native artifact
      uses: actions/download-artifact@v4
      with:
        name: native-osx-arm64
        path: LlmAgents.Tools/runtimes/osx-arm64/native

    - name: Restore dependencies
      run: dotnet restore

    - name: Build managed code
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --filter "TestCategory!=Integration"

    - name: Set package version
      id: set_version
      run: |
        if [[ "${{ github.event_name }}" == "push" ]]; then
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "PACKAGE_VERSION=0.0.1-$SHORT_SHA" >> $GITHUB_OUTPUT
        else
          TAG_VERSION=${{ github.event.release.tag_name }}
          if [[ $TAG_VERSION == v* ]]; then
            TAG_VERSION=${TAG_VERSION#v}
          fi
          echo "PACKAGE_VERSION=$TAG_VERSION" >> $GITHUB_OUTPUT
        fi

    - name: Pack
      run: dotnet pack --configuration Release --no-build --output ./nupkg /p:Version=${{ steps.set_version.outputs.PACKAGE_VERSION }}

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: nupkgs
        path: ./nupkg/*.nupkg

    - name: Publish to NuGet
      if: github.event_name == 'release'
      run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/victorqhong/index.json

    - name: Upload release artifacts
      if: github.event_name == 'release'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" ./nupkg/*.nupkg --clobber
