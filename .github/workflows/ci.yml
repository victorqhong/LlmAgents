name: build and test pull request

on:
  pull_request:
    branches: [ master ]

jobs:
  matrix:
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-restore --configuration Release --verbosity detailed --logger "console;verbosity=detailed" --blame-crash --blame-hang-timeout 60s --filter "TestCategory!=Integration"

  # Single gate job with a stable check name. Because the matrix job above
  # produces one check per OS (e.g. "build-and-test (ubuntu-latest)"), a
  # required status check named "build-and-test" would never be reported.
  # This job provides that single check and only succeeds if every matrix
  # leg passed.
  build-and-test:
    name: build-and-test
    needs: matrix
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all matrix legs passed
        if: needs.matrix.result != 'success'
        run: |
          echo "One or more matrix jobs failed (result: ${{ needs.matrix.result }})"
          exit 1
      - name: All matrix legs passed
        run: echo "All build-and-test matrix legs passed"
